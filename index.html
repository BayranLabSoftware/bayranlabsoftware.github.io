<title>Bayran Office — I tuoi documenti. Solo tuoi.</title>
<meta name="description" content="Suite documenti e editor PDF 100% offline. Leggi, scansiona, firma, converti e traduci — senza internet, senza account.">
<style>
  :root{
    --teal:#0d6e64; --teal2:#12a79e; --teal3:#0e7d8f; --ink:#13242a; --ink2:#4a5b62;
    --bg:#ffffff; --soft:#f3f7f7; --line:#e3eceb; --white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',-apple-system,Roboto,'Yu Gothic UI','Malgun Gothic',Arial,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  /* header */
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;gap:14px;height:68px}
  .brand{display:flex;align-items:center}
  .brand .hlogo{height:46px;width:auto}
  .spacer{flex:1}
  /* selettore lingua personalizzato (con bandiere) */
  .langsel{position:relative}
  .langbtn{display:inline-flex;align-items:center;font:inherit;font-size:14px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer}
  .langbtn .chev{width:16px;height:16px;opacity:.55;margin-left:5px}
  .langmenu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.16);padding:6px;display:none;max-height:330px;overflow:auto;z-index:40;min-width:188px}
  .langsel.open .langmenu{display:block}
  .lmi{display:flex;align-items:center;width:100%;font:inherit;font-size:14px;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink);text-align:left}
  .lmi:hover{background:var(--soft)}
  .lmi.on{background:#e7f3f1;font-weight:700}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;font-weight:700;
    padding:11px 18px;border-radius:11px;text-decoration:none;font-size:15px;border:0;cursor:pointer;transition:transform .12s,filter .12s}
  .btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .btn.sm{padding:8px 14px;font-size:14px}
  .btn svg{width:18px;height:18px}
  /* hero */
  .hero{background:linear-gradient(160deg,var(--teal) 0%,var(--teal2) 60%,var(--teal3) 100%);color:#fff;overflow:hidden}
  .hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:64px 22px 70px}
  .kick{display:inline-flex;align-items:center;gap:11px;font-size:19px;font-weight:700;letter-spacing:.01em;opacity:.97;margin-bottom:16px}
  .kicklogo{width:38px;height:38px;border-radius:10px;background:#fff;padding:3px;object-fit:contain;box-shadow:0 5px 16px rgba(0,0,0,.2)}
  .hero h1{font-size:52px;line-height:1.04;font-weight:800;letter-spacing:-.02em;margin-bottom:18px;text-shadow:0 2px 18px rgba(0,0,0,.16)}
  .hero p.sub{font-size:20px;opacity:.95;max-width:460px;margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 26px}
  .chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
  .hero .btn{background:#fff;color:var(--teal)}
  .phone{justify-self:center;width:270px;border-radius:34px;background:#0a3b39;padding:9px;box-shadow:0 30px 70px rgba(0,0,0,.33);border:1px solid rgba(255,255,255,.18)}
  .phone img{border-radius:26px;width:100%}
  /* sections */
  section{padding:66px 0}
  h2.sect{font-size:33px;font-weight:800;letter-spacing:-.01em;text-align:center;margin-bottom:10px}
  .lead{text-align:center;color:var(--ink2);font-size:17px;max-width:620px;margin:0 auto 40px}
  /* features */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:24px}
  .ic{width:46px;height:46px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .ic svg{width:24px;height:24px;stroke:var(--teal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .card h3{font-size:18px;font-weight:700;margin-bottom:6px}
  .card p{color:var(--ink2);font-size:15px}
  /* privacy band */
  .privacy{background:#0c2b2a;color:#eaf6f4}
  .privacy .wrap{text-align:center;padding:64px 22px}
  .privacy .lock{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .privacy .lock svg{width:30px;height:30px;stroke:#7fe3d3;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .privacy h2{font-size:31px;font-weight:800;margin-bottom:14px}
  .privacy p{max-width:620px;margin:0 auto;font-size:17px;opacity:.92}
  /* shots */
  .shots{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
  .frame{width:230px;border-radius:26px;background:#0a3b39;padding:7px;box-shadow:0 18px 44px rgba(0,0,0,.16)}
  .frame img{border-radius:21px;width:100%}
  /* langs */
  .langs{background:var(--soft)}
  .langgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:760px;margin:8px auto 0}
  .langgrid span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;color:var(--ink2)}
  /* cta strip */
  .ctaStrip{background:linear-gradient(120deg,var(--teal),var(--teal3));color:#fff;text-align:center}
  .ctaStrip .wrap{padding:56px 22px}
  .ctaStrip h2{font-size:30px;font-weight:800;margin-bottom:20px}
  /* store badges (immagini ufficiali) */
  .badges{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .badge-img{position:relative;display:inline-flex;align-items:center;text-decoration:none}
  .badge-img > img{display:block;height:52px;width:auto}
  .badge-img.gp > img{height:58px}
  .badge-img[href]{transition:transform .12s,filter .12s}
  .badge-img[href]:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .badge-img.soon{flex-direction:column;align-items:center;gap:7px}
  .badge-img.soon > img{opacity:.6}
  .soonlbl{background:#ffc107;color:#181818;font-weight:800;font-size:11px;font-style:normal;
    padding:4px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 9px rgba(0,0,0,.25);letter-spacing:.01em}
  /* flags */
  .flag{width:22px;height:15px;border-radius:3px;object-fit:cover;margin-right:8px;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex:0 0 auto}
  .langgrid span{display:inline-flex;align-items:center}
  /* footer */
  footer{background:#08201f;color:#bcd3cf;font-size:14px}
  footer .wrap{padding:36px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  footer a{color:#9fe6d8;text-decoration:none}
  footer a:hover{text-decoration:underline}
  .fbrand{display:flex;align-items:center;gap:9px;font-weight:700;color:#eaf6f4}
  .fbrand img{width:26px;height:26px;border-radius:7px}
  /* responsive */
  @media(max-width:820px){
    .hero .wrap{grid-template-columns:1fr;text-align:center;padding:48px 22px 54px}
    .hero h1{font-size:40px}.hero p.sub{margin-left:auto;margin-right:auto}
    .chips{justify-content:center}.phone{margin-top:10px;width:240px}
    .grid{grid-template-columns:1fr}
    h2.sect{font-size:27px}.privacy h2{font-size:26px}
  }
</style></head>

const SHOT = { it:'it', en:'en', es:'es', fr:'fr', de:'de', pt:'pt', pl:'pl', nl:'nl', tr:'tr', ro:'ro', ru:'ru', uk:'uk', id:'id', vi:'vi', ja:'ja', ko:'ko' };
function render(code){
  const d = LANG[code] || LANG.en;
  document.documentElement.lang = code;
  document.querySelectorAll('[data-t]').forEach(el=>{ const k=el.getAttribute('data-t'); if(d[k]!=null) el.textContent=d[k]; });
  const fg = document.getElementById('features');
  fg.innerHTML = d.feat.map((f,i)=>'<div class="card"><div class="ic">'+iconSvg(i)+'</div><h3>'+f[0]+'</h3><p>'+f[1]+'</p></div>').join('');
  const s = SHOT[code] || 'en';
  document.getElementById('heroShot').src = 'img/01-home-'+s+'.png';
  document.getElementById('shotHome').src = 'img/01-home-'+s+'.png';
  document.getElementById('shotOffline').src = 'img/02-offline-'+s+'.png';
  const soon = SOON[code] || SOON.en;
  document.querySelectorAll('.badges').forEach(el=>el.innerHTML = badgeMarkup(soon, code));
  document.getElementById('curflag').src = 'img/flags/'+code+'.png';
  document.getElementById('curlang').textContent = (LANG[code]||LANG.en).name;
  document.querySelectorAll('#langmenu .lmi').forEach(el=>el.classList.toggle('on', el.dataset.c===code));
  document.getElementById('fcookie').textContent = '🔒 ' + (COOKIE[code] || COOKIE.en);
}
(function init(){
  const menu = document.getElementById('langmenu'), sel = document.getElementById('langsel'), btn = document.getElementById('langbtn');
  menu.innerHTML = Object.keys(LANG).map(c=>'<button class="lmi" data-c="'+c+'" role="menuitem"><img class="flag" src="img/flags/'+c+'.png" alt="">'+LANG[c].name+'</button>').join('');
  btn.addEventListener('click', e=>{ e.stopPropagation(); const open=sel.classList.toggle('open'); btn.setAttribute('aria-expanded', open); });
  menu.addEventListener('click', e=>{ const it=e.target.closest('.lmi'); if(!it) return; render(it.dataset.c); sel.classList.remove('open'); });
  document.addEventListener('click', ()=>sel.classList.remove('open'));
  let pref = (navigator.language||'en').slice(0,2).toLowerCase();
  if(!LANG[pref]) pref='en';
  render(pref);
})();
</script>
