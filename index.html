<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayran Office — I tuoi documenti. Solo tuoi.</title>
<meta name="description" content="Suite documenti e editor PDF 100% offline. Leggi, scansiona, firma, converti e traduci — senza internet, senza account.">
<style>
  :root{
    --teal:#0d6e64; --teal2:#12a79e; --teal3:#0e7d8f; --ink:#13242a; --ink2:#4a5b62;
    --bg:#ffffff; --soft:#f3f7f7; --line:#e3eceb; --white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',-apple-system,Roboto,'Yu Gothic UI','Malgun Gothic',Arial,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  /* header */
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;gap:14px;height:68px}
  .brand{display:flex;align-items:center}
  .brand .hlogo{height:46px;width:auto}
  .spacer{flex:1}
  /* selettore lingua personalizzato (con bandiere) */
  .langsel{position:relative}
  .langbtn{display:inline-flex;align-items:center;font:inherit;font-size:14px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer}
  .langbtn .chev{width:16px;height:16px;opacity:.55;margin-left:5px}
  .langmenu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.16);padding:6px;display:none;max-height:330px;overflow:auto;z-index:40;min-width:188px}
  .langsel.open .langmenu{display:block}
  .lmi{display:flex;align-items:center;width:100%;font:inherit;font-size:14px;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink);text-align:left}
  .lmi:hover{background:var(--soft)}
  .lmi.on{background:#e7f3f1;font-weight:700}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;font-weight:700;
    padding:11px 18px;border-radius:11px;text-decoration:none;font-size:15px;border:0;cursor:pointer;transition:transform .12s,filter .12s}
  .btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .btn.sm{padding:8px 14px;font-size:14px}
  .btn svg{width:18px;height:18px}
  /* hero */
  .hero{background:linear-gradient(160deg,var(--teal) 0%,var(--teal2) 60%,var(--teal3) 100%);color:#fff;overflow:hidden}
  .hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:64px 22px 70px}
  .kick{display:inline-flex;align-items:center;gap:11px;font-size:19px;font-weight:700;letter-spacing:.01em;opacity:.97;margin-bottom:16px}
  .kicklogo{width:38px;height:38px;border-radius:10px;background:#fff;padding:3px;object-fit:contain;box-shadow:0 5px 16px rgba(0,0,0,.2)}
  .hero h1{font-size:52px;line-height:1.04;font-weight:800;letter-spacing:-.02em;margin-bottom:18px;text-shadow:0 2px 18px rgba(0,0,0,.16)}
  .hero p.sub{font-size:20px;opacity:.95;max-width:460px;margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 26px}
  .chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
  .hero .btn{background:#fff;color:var(--teal)}
  .phone{justify-self:center;width:270px;border-radius:34px;background:#0a3b39;padding:9px;box-shadow:0 30px 70px rgba(0,0,0,.33);border:1px solid rgba(255,255,255,.18)}
  .phone img{border-radius:26px;width:100%}
  /* sections */
  section{padding:66px 0}
  h2.sect{font-size:33px;font-weight:800;letter-spacing:-.01em;text-align:center;margin-bottom:10px}
  .lead{text-align:center;color:var(--ink2);font-size:17px;max-width:620px;margin:0 auto 40px}
  /* features */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:24px}
  .ic{width:46px;height:46px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .ic svg{width:24px;height:24px;stroke:var(--teal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .card h3{font-size:18px;font-weight:700;margin-bottom:6px}
  .card p{color:var(--ink2);font-size:15px}
  /* privacy band */
  .privacy{background:#0c2b2a;color:#eaf6f4}
  .privacy .wrap{text-align:center;padding:64px 22px}
  .privacy .lock{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .privacy .lock svg{width:30px;height:30px;stroke:#7fe3d3;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .privacy h2{font-size:31px;font-weight:800;margin-bottom:14px}
  .privacy p{max-width:620px;margin:0 auto;font-size:17px;opacity:.92}
  /* shots */
  .shots{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
  .frame{width:230px;border-radius:26px;background:#0a3b39;padding:7px;box-shadow:0 18px 44px rgba(0,0,0,.16)}
  .frame img{border-radius:21px;width:100%}
  /* langs */
  .langs{background:var(--soft)}
  .langgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:760px;margin:8px auto 0}
  .langgrid span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;color:var(--ink2)}
  /* cta strip */
  .ctaStrip{background:linear-gradient(120deg,var(--teal),var(--teal3));color:#fff;text-align:center}
  .ctaStrip .wrap{padding:56px 22px}
  .ctaStrip h2{font-size:30px;font-weight:800;margin-bottom:20px}
  /* store badges (immagini ufficiali) */
  .badges{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .badge-img{position:relative;display:inline-flex;align-items:center;text-decoration:none}
  .badge-img > img{display:block;height:52px;width:auto}
  .badge-img.gp > img{height:58px}
  .badge-img[href]{transition:transform .12s,filter .12s}
  .badge-img[href]:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .badge-img.soon{flex-direction:column;align-items:center;gap:7px}
  .badge-img.soon > img{opacity:.6}
  .soonlbl{background:#ffc107;color:#181818;font-weight:800;font-size:11px;font-style:normal;
    padding:4px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 9px rgba(0,0,0,.25);letter-spacing:.01em}
  /* flags */
  .flag{width:22px;height:15px;border-radius:3px;object-fit:cover;margin-right:8px;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex:0 0 auto}
  .langgrid span{display:inline-flex;align-items:center}
  /* footer */
  footer{background:#08201f;color:#bcd3cf;font-size:14px}
  footer .wrap{padding:36px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  footer a{color:#9fe6d8;text-decoration:none}
  footer a:hover{text-decoration:underline}
  .fbrand{display:flex;align-items:center;gap:9px;font-weight:700;color:#eaf6f4}
  .fbrand img{width:26px;height:26px;border-radius:7px}
  /* responsive */
  @media(max-width:820px){
    .hero .wrap{grid-template-columns:1fr;text-align:center;padding:48px 22px 54px}
    .hero h1{font-size:40px}.hero p.sub{margin-left:auto;margin-right:auto}
    .chips{justify-content:center}.phone{margin-top:10px;width:240px}
    .grid{grid-template-columns:1fr}
    h2.sect{font-size:27px}.privacy h2{font-size:26px}
  }
</style></head>

  ar:{"name":"العربية","h1a":"مستنداتك.","h1b":"لك وحدك.","heroSub":"حزمة المستندات ومحرّر PDF الذي يعمل دون إنترنت. على هاتفك فقط.","c1":"100% دون اتصال","c2":"بلا حساب","c3":"بلا اشتراكات","cta":"احصل عليه من Google Play","featTitle":"كل ما تحتاجه لمستنداتك","featLead":"تطبيق واحد للقراءة والمسح والتوقيع والتحويل والكتابة والترجمة — كل ذلك دون اتصال.","feat":[["اقرأ كل شيء","PDF وWord وExcel وPowerPoint وكتب EPUB والصور. قراءة سلسة، الوضع الليلي، القراءة بصوت عالٍ."],["امسح مع OCR","حواف تلقائية ونص قابل للبحث، حتى دون اتصال. بطاقة → جهة اتصال، جدول → Excel، الهوية أمام وخلف في PDF واحد."],["محرّر PDF","وقّع، علّق، املأ النماذج، ظلّل. ادمج، قسّم، اضغط، احمِ بـ AES-256، أخفِ فعلاً."],["حوّل","صور ومسح → PDF. جدول مُصوَّر → Excel. PDF → نص عبر OCR."],["اكتب وأنشئ","مستندات Word حقيقية، جداول بمعادلات، 22 قالبًا جاهزًا (فاتورة، سيرة ذاتية، رسائل…)."],["ترجمة دون اتصال","ترجم النصوص والصور وملفات PDF دون إنترنت. الإيطالية ⇄ الإنجليزية مضمّنة."]],"privTitle":"خصوصية حقيقية، وليست وعدًا","privText":"لا يملك Bayran Office حتى إذن الإنترنت — يمكنك التحقق بنفسك في إعدادات Android. بلا حساب، بلا سحابة، بلا إعلانات، بلا تتبّع. كل ما تمسحه وتوقّعه وتكتبه يبقى على هاتفك.","shotsTitle":"انظر عن قرب","shotsLead":"واجهة نظيفة، بالعربية و21 لغة أخرى.","langsTitle":"بـ 22 لغة","langsText":"الواجهة والقوالب وأسماء الملفات مُترجمة إلى 22 لغة.","ctaStrip":"مستعد لإبقاء مستنداتك آمنة فعلاً؟","fPrivacy":"سياسة الخصوصية","fContact":"اتصل بنا"}

const EXTRA = {"it":[["Firma digitale e fatture","Firma i PDF, crea firme digitali (.p12) o firma da remoto col tuo provider. Apri e verifica file .p7m, fatture elettroniche e PDF firmati: ti dice chi ha firmato."],["Cassaforte con PIN","Metti i documenti sensibili in cassaforte: cifrati e protetti da PIN, solo sul tuo telefono."],["Organizza tutto","Cartelle, preferiti, etichette, ricerca e recenti: ritrovi ogni documento in un attimo."]],"en":[["Digital signatures & e-invoices","Sign PDFs, create digital signatures (.p12) or sign remotely with your provider. Open and verify .p7m files, e-invoices and signed PDFs — it tells you who signed."],["PIN-locked vault","Keep sensitive documents in a vault: encrypted and PIN-protected, only on your phone."],["Organize everything","Folders, favorites, tags, search and recents: find any document in seconds."]],"es":[["Firma digital y facturas","Firma PDF, crea firmas digitales (.p12) o firma en remoto con tu proveedor. Abre y verifica archivos .p7m, facturas electrónicas y PDF firmados: te dice quién firmó."],["Caja fuerte con PIN","Guarda los documentos sensibles en una caja fuerte: cifrados y protegidos con PIN, solo en tu teléfono."],["Organiza todo","Carpetas, favoritos, etiquetas, búsqueda y recientes: encuentra cualquier documento en segundos."]],"fr":[["Signature numérique et factures","Signez des PDF, créez des signatures numériques (.p12) ou signez à distance avec votre prestataire. Ouvrez et vérifiez les fichiers .p7m, factures électroniques et PDF signés : il vous dit qui a signé."],["Coffre-fort avec PIN","Rangez les documents sensibles dans un coffre-fort : chiffrés et protégés par PIN, sur votre téléphone seulement."],["Organisez tout","Dossiers, favoris, étiquettes, recherche et récents : retrouvez n’importe quel document en un instant."]],"de":[["Digitale Signatur & E-Rechnungen","PDFs signieren, digitale Signaturen (.p12) erstellen oder per Anbieter aus der Ferne signieren. .p7m-Dateien, E-Rechnungen und signierte PDFs öffnen und prüfen — zeigt, wer signiert hat."],["Tresor mit PIN","Sensible Dokumente im Tresor: verschlüsselt und PIN-geschützt, nur auf deinem Telefon."],["Alles organisieren","Ordner, Favoriten, Tags, Suche und Zuletzt: jedes Dokument in Sekunden finden."]],"pt":[["Assinatura digital e faturas","Assine PDF, crie assinaturas digitais (.p12) ou assine remotamente com o teu fornecedor. Abre e verifica ficheiros .p7m, faturas eletrónicas e PDF assinados: mostra quem assinou."],["Cofre com PIN","Guarda os documentos sensíveis num cofre: cifrados e protegidos por PIN, só no teu telemóvel."],["Organiza tudo","Pastas, favoritos, etiquetas, pesquisa e recentes: encontra qualquer documento num instante."]],"pl":[["Podpis cyfrowy i e-faktury","Podpisuj PDF-y, twórz podpisy cyfrowe (.p12) lub podpisuj zdalnie u dostawcy. Otwieraj i weryfikuj pliki .p7m, e-faktury i podpisane PDF-y — pokazuje, kto podpisał."],["Sejf z PIN-em","Trzymaj poufne dokumenty w sejfie: zaszyfrowane i chronione PIN-em, tylko na Twoim telefonie."],["Uporządkuj wszystko","Foldery, ulubione, etykiety, wyszukiwanie i ostatnie: znajdź każdy dokument w sekundę."]],"nl":[["Digitale handtekening & e-facturen","Onderteken pdf’s, maak digitale handtekeningen (.p12) of teken op afstand met je provider. Open en verifieer .p7m-bestanden, e-facturen en ondertekende pdf’s — je ziet wie ondertekende."],["Kluis met pincode","Bewaar gevoelige documenten in een kluis: versleuteld en met pincode beveiligd, alleen op je telefoon."],["Alles ordenen","Mappen, favorieten, labels, zoeken en recent: vind elk document in seconden."]],"tr":[["Dijital imza ve e-faturalar","PDF imzalayın, dijital imzalar (.p12) oluşturun veya sağlayıcınızla uzaktan imzalayın. .p7m dosyalarını, e-faturaları ve imzalı PDF’leri açıp doğrulayın — kimin imzaladığını gösterir."],["PIN’li kasa","Hassas belgeleri kasada tutun: şifreli ve PIN korumalı, yalnızca telefonunuzda."],["Her şeyi düzenle","Klasörler, favoriler, etiketler, arama ve son kullanılanlar: her belgeyi saniyede bulun."]],"ro":[["Semnătură digitală și facturi","Semnează PDF-uri, creează semnături digitale (.p12) sau semnează la distanță cu furnizorul tău. Deschide și verifică fișiere .p7m, facturi electronice și PDF-uri semnate: îți arată cine a semnat."],["Seif cu PIN","Ține documentele sensibile într-un seif: criptate și protejate cu PIN, doar pe telefonul tău."],["Organizează tot","Foldere, favorite, etichete, căutare și recente: găsești orice document într-o clipă."]],"ru":[["Цифровая подпись и э-счета","Подписывайте PDF, создавайте цифровые подписи (.p12) или подписывайте удалённо через провайдера. Открывайте и проверяйте файлы .p7m, электронные счета и подписанные PDF — видно, кто подписал."],["Сейф с PIN-кодом","Храните важные документы в сейфе: зашифрованы и защищены PIN-кодом, только на вашем телефоне."],["Всё по полочкам","Папки, избранное, метки, поиск и недавние: любой документ находится за секунды."]],"uk":[["Цифровий підпис і е-рахунки","Підписуйте PDF, створюйте цифрові підписи (.p12) або підписуйте віддалено через провайдера. Відкривайте й перевіряйте файли .p7m, електронні рахунки та підписані PDF — видно, хто підписав."],["Сейф з PIN-кодом","Тримайте важливі документи в сейфі: зашифровані та захищені PIN-кодом, лише на вашому телефоні."],["Усе впорядковано","Папки, обране, мітки, пошук і нещодавні: будь-який документ знаходиться за секунди."]],"id":[["Tanda tangan digital & e-faktur","Tanda tangani PDF, buat tanda tangan digital (.p12) atau tanda tangan jarak jauh lewat penyedia. Buka dan verifikasi berkas .p7m, e-faktur, dan PDF bertanda tangan — menampilkan siapa penandatangannya."],["Brankas ber-PIN","Simpan dokumen sensitif di brankas: terenkripsi dan dilindungi PIN, hanya di ponselmu."],["Atur semuanya","Folder, favorit, label, pencarian, dan terbaru: temukan dokumen apa pun dalam sekejap."]],"vi":[["Chữ ký số & hóa đơn điện tử","Ký PDF, tạo chữ ký số (.p12) hoặc ký từ xa với nhà cung cấp. Mở và xác minh tệp .p7m, hóa ిజిటల్ సంతకం & ఇ-ఇన్‌వాయిస్‌లు","PDFలపై సంతకం చేయండి, డిజిటల్ సంతకాలు (.p12) సృష్టించండి లేదా మీ ప్రొవైడర్‌తో రిమోట్‌గా సంతకం చేయండి. .p7m ఫైళ్లు, ఇ-ఇన్‌వాయిస్‌లు, సంతకం చేసిన PDFలను తెరిచి ధృవీకరించండి — ఎవరు సంతకం చేశారో చూపుతుంది."],["PIN వాల్ట్","సున్నితమైన పత్రాలను వాల్ట్‌లో ఉంచండి: ఎన్‌క్రిప్ట్ చేసి PINతో రక్షితం, మీ ఫోన్‌లో మాత్రమే."],["అన్నీ చక్కగా","ఫోల్డర్‌లు, ఇష్టమైనవి, ట్యాగ్‌లు, శోధన, ఇటీవలివి: ఏ పత్రాన్నైనా క్షణాల్లో కనుగొనండి."]],"ta":[["மின் கையொப்பம் & மின்-விலைப்பட்டியல்","PDF-களில் கையொப்பமிடுங்கள், டிஜிட்டல் கையொப்பங்களை (.p12) உருவாக்குங்கள் அல்லது உங்கள் வழங்குநர் மூலம் தொலைவிலிருந்து கையொப்பமிடுங்கள். .p7m கோப்புகள், மின்-விலைப்பட்டியல்கள், கையொப்பமிட்ட PDF-களைத் திறந்து சரிபார்க்கவும் — யார் கையொப்பமிட்டார் எனக் காட்டும்."],["PIN பெட்டகம்","முக்கியமான ஆவணங்களைப் பெட்டகத்தில் வைக்கவும்: மறையாக்கம் + PIN பாதுகாப்பு, உங்கள் தொலைபேசியில் மட்டும்."],["அனைத்தையும் ஒழுங்கு","கோப்புறைகள், பிடித்தவை, குறிச்சொற்கள், தேடல், சமீபத்தியவை: எந்த ஆவணத்தையும் நொடியில் கண்டறியுங்கள்."]],"ar":[["التوقيع الرقمي والفواتير الإلكترونية","وقّع ملفات PDF، وأنشئ توقيعات رقمية (.p12) أو وقّع عن بُعد عبر مزوّدك. افتح وتحقّق من ملفات .p7m والفواتير الإلكترونية وملفات PDF الموقّعة — يُظهر لك من وقّع."],["خزنة برقم PIN","احفظ المستندات الحساسة في خزنة: مشفّرة ومحمية برقم PIN، على هاتفك فقط."],["نظّم كل شيء","مجلدات ومفضّلة ووسوم وبحث وأخيرة: اعثر على أي مستند في ثوانٍ."]]};
const SHOT = { it:'it', en:'en', es:'es', fr:'fr', de:'de', pt:'pt', pl:'pl', nl:'nl', tr:'tr', ro:'ro', ru:'ru', uk:'uk', id:'id', vi:'vi', ja:'ja', ko:'ko', hi:'hi', bn:'bn', mr:'mr', te:'te', ta:'ta', ar:'ar' };
function render(code){
  const d = LANG[code] || LANG.en;
  document.documentElement.lang = code; document.documentElement.dir = (code==='ar'?'rtl':'ltr');
  document.querySelectorAll('[data-t]').forEach(el=>{ const k=el.getAttribute('data-t'); if(d[k]!=null) el.textContent=d[k]; });
  const fg = document.getElementById('features');
  fg.innerHTML = (d.feat.concat(EXTRA[code]||[])).map((f,i)=>'<div class="card"><div class="ic">'+iconSvg(i)+'</div><h3>'+f[0]+'</h3><p>'+f[1]+'</p></div>').join('');
  const s = SHOT[code] || 'en';
  document.getElementById('heroShot').src = 'img/01-home-'+s+'.png';
  document.getElementById('shotHome').src = 'img/01-home-'+s+'.png';
  document.getElementById('shotOffline').src = 'img/02-offline-'+s+'.png';
  const soon = SOON[code] || SOON.en;
  document.querySelectorAll('.badges').forEach(el=>el.innerHTML = badgeMarkup(soon, code));
  document.getElementById('curflag').src = 'img/flags/'+code+'.png';
  document.getElementById('curlang').textContent = (LANG[code]||LANG.en).name;
  document.querySelectorAll('#langmenu .lmi').forEach(el=>el.classList.toggle('on', el.dataset.c===code));
  document.getElementById('fcookie').textContent = '🔒 ' + (COOKIE[code] || COOKIE.en);
}
(function init(){
  const menu = document.getElementById('langmenu'), sel = document.getElementById('langsel'), btn = document.getElementById('langbtn');
  menu.innerHTML = Object.keys(LANG).map(c=>'<button class="lmi" data-c="'+c+'" role="menuitem"><img class="flag" src="img/flags/'+c+'.png" alt="">'+LANG[c].name+'</button>').join('');
  btn.addEventListener('click', e=>{ e.stopPropagation(); const open=sel.classList.toggle('open'); btn.setAttribute('aria-expanded', open); });
  menu.addEventListener('click', e=>{ const it=e.target.closest('.lmi'); if(!it) return; render(it.dataset.c); sel.classList.remove('open'); });
  document.addEventListener('click', ()=>sel.classList.remove('open'));
  let pref = (navigator.language||'en').slice(0,2).toLowerCase();
  if(!LANG[pref]) pref='en';
  render(pref);
})();
</script>
