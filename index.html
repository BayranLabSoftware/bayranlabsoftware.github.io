<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BayranLab Software</title>
<meta name="description" content="I software di BayranLab Software: Bayran Cleaner per Mac e Bayran Office per iPhone e iPad.">
<link rel="icon" href="img/logo-dog.png">
<meta property="og:title" content="BayranLab Software">
<meta property="og:description" content="Bayran Cleaner per Mac, Bayran Office per iPhone e iPad.">
<meta property="og:image" content="https://bayranlabsoftware.github.io/img/logo-dog.png">
<style>
  :root {
    --ink: #13242a;
    --muted: #5b7683;
    --line: #dbe7ec;
    --card: #ffffff;
    --bg: #f4f9fb;
    --blu: #1f7aa8;
    --ciano: #41abd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eef6fa; --muted: #9db4c0; --line: rgba(255,255,255,.12);
      --card: #12242e; --bg: #0b1720;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 22px 60px;
    /* alone del marchio, appena accennato */
    background-image: radial-gradient(900px 460px at 50% -140px,
                      color-mix(in srgb, var(--ciano) 20%, transparent), transparent 70%);
  }

  /* ---------------- testata: il marchio e basta ---------------- */
  header { text-align: center; padding: 74px 0 8px; }
  header .cane {
    width: 168px; height: 168px; display: block; margin: 0 auto 22px;
    filter: drop-shadow(0 12px 30px color-mix(in srgb, var(--blu) 26%, transparent));
  }
  header .scritta { width: min(330px, 76vw); height: auto; display: block; margin: 0 auto; }
  /* Il marchio e' un'immagine con dentro il nome: per chi legge con la voce
     e per i motori di ricerca il nome deve esistere comunque come testo. */
  h1 {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------------- le due schede ---------------- */
  main {
    width: 100%; max-width: 940px; margin-top: 54px;
    display: grid; gap: 22px; grid-template-columns: repeat(2, 1fr);
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }

  .scheda {
    display: flex; flex-direction: column; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; transition: transform .18s ease, box-shadow .18s ease,
                                  border-color .18s ease;
  }
  .scheda:hover, .scheda:focus-visible {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--ciano) 55%, var(--line));
    box-shadow: 0 16px 40px color-mix(in srgb, var(--blu) 18%, transparent);
  }
  .scheda:focus-visible { outline: 3px solid var(--ciano); outline-offset: 3px; }

  /* Riquadro dell'immagine ad altezza fissa: le due anteprime hanno forme
     molto diverse (un Mac largo, un telefono alto) e senza un riquadro
     comune le schede verrebbero di due altezze diverse. Le immagini sono
     ancorate in alto e sbordano sotto: si vede la parte che conta e le due
     schede restano uguali, invece di rimpicciolire il telefono fino a
     renderlo illeggibile pur di farlo stare tutto dentro. */
  .vetrina {
    height: 210px; display: flex; align-items: flex-start; justify-content: center;
    padding-top: 24px;
    background: linear-gradient(160deg,
                color-mix(in srgb, var(--blu) 92%, #000),
                color-mix(in srgb, var(--ciano) 78%, #0a3550));
    overflow: hidden;
  }
  .vetrina img { border-radius: 8px 8px 0 0; box-shadow: 0 12px 30px rgba(0,0,0,.38); }
  .vetrina .mac { width: 86%; height: auto; }
  .vetrina .telefono { width: 124px; height: auto; }

  .testo { padding: 20px 22px 22px; display: flex; flex-direction: column;
           gap: 7px; flex: 1; }
  .nome { font-size: 21px; font-weight: 700; letter-spacing: -.2px; }
  .claim { color: var(--muted); }
  .piede { margin-top: auto; padding-top: 14px; display: flex;
           align-items: center; justify-content: space-between; gap: 12px; }
  .dove { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line);
          border-radius: 20px; padding: 3px 11px; white-space: nowrap; }
  .vai { font-weight: 600; color: var(--blu); white-space: nowrap; }
  @media (prefers-color-scheme: dark) { .vai { color: var(--ciano); } }
  .scheda:hover .vai .freccia { transform: translateX(4px); }
  .freccia { display: inline-block; transition: transform .18s ease; }

  footer { margin-top: 52px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>BayranLab Software</h1>
  <img class="cane" src="img/logo-dog.png" alt="">
  <img class="scritta" src="img/bayranlab-logo.png" alt="BayranLab Software">
</header>

<main>
  <a class="scheda" href="bayrancleaner/">
    <div class="vetrina"><img class="mac" src="img/card-cleaner.png" alt="La panoramica di Bayran Cleaner"></div>
    <div class="testo">
      <div class="nome">Bayran Cleaner</div>
      <div class="claim">Pulizia onesta per il tuo Mac.</div>
      <div class="piede">
        <span class="dove">macOS · gratuito</span>
        <span class="vai">Vai <span class="freccia">→</span></span>
      </div>
    </div>
  </a>

  <a class="scheda" href="bayranoffice/">
    <div class="vetrina"><img class="telefono" src="img/card-office.png" alt="La schermata iniziale di Bayran Office"></div>
    <div class="testo">
      <div class="nome">Bayran Office</div>
      <div class="claim">I tuoi documenti. Solo tuoi.</div>
      <div class="piede">
        <span class="dove">iPhone e iPad</span>
        <span class="vai">Vai <span class="freccia">→</span></span>
      </div>
    </div>
  </a>
</main>

<footer>BayranLab Software</footer>

</body>
</html>
