<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- Shadow under the whole structure -->
  <ellipse cx="300" cy="390" rx="220" ry="18" fill="#ffffff08"/>

  <!-- === GREEN WAREHOUSE (left) === -->
  <!-- Main body -->
  <rect x="70" y="120" width="130" height="200" rx="8" fill="#2E7D32"/>
  <!-- Roof (pitched) -->
  <path d="M60 120 L135 60 L210 120 Z" fill="#1B5E20"/>
  <!-- Vent/window -->
  <rect x="95" y="200" width="40" height="50" rx="4" fill="#1B5E20" opacity="0.7"/>
  <line x1="95" y1="212" x2="135" y2="212" stroke="#2E7D32" stroke-width="2"/>
  <line x1="95" y1="224" x2="135" y2="224" stroke="#2E7D32" stroke-width="2"/>
  <line x1="95" y1="236" x2="135" y2="236" stroke="#2E7D32" stroke-width="2"/>
  <!-- Door -->
  <rect x="150" y="240" width="35" height="80" rx="3" fill="#1B5E20"/>
  <circle cx="179" cy="280" r="3" fill="#4CAF50"/>

  <!-- === ORANGE SHOP (right) === -->
  <!-- Main body -->
  <rect x="400" y="120" width="130" height="200" rx="8" fill="#E65100"/>
  <!-- Shop front window -->
  <rect x="415" y="180" width="50" height="60" rx="4" fill="#FF8F00"/>
  <!-- Door -->
  <rect x="480" y="220" width="35" height="100" rx="3" fill="#BF360C"/>
  <circle cx="509" cy="270" r="3" fill="#FFAB40"/>
  <!-- Awning -->
  <path d="M395 120 L535 120 L535 90 L395 90 Z" fill="#E65100"/>
  <!-- Awning stripes -->
  <path d="M395 90 L405 120 M415 90 L425 120 M435 90 L445 120 M455 90 L465 120 M475 90 L485 120 M495 90 L505 120 M515 90 L525 120" stroke="white" stroke-width="3"/>
  <!-- Awning scallop -->
  <path d="M395 120 Q405 135 415 120 Q425 135 435 120 Q445 135 455 120 Q465 135 475 120 Q485 135 495 120 Q505 135 515 120 Q525 135 535 120" fill="#E65100" stroke="#E65100"/>

  <!-- === GREEN ARCH/BRIDGE === -->
  <path d="M200 320 Q300 120 400 320" stroke="#2E7D32" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M200 320 Q300 140 400 320" stroke="#388E3C" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- Bridge pillars -->
  <rect x="190" y="280" width="25" height="40" rx="4" fill="#2E7D32"/>
  <rect x="385" y="280" width="25" height="40" rx="4" fill="#2E7D32"/>

  <!-- === CONVEYOR BELT (top of bridge) === -->
  <line x1="135" y1="118" x2="465" y2="118" stroke="#37474F" stroke-width="5"/>
  <!-- Rails -->
  <line x1="135" y1="113" x2="465" y2="113" stroke="#546E7A" stroke-width="2"/>

  <!-- === TRAIN ENGINE (small, green) === -->
  <rect x="310" y="88" width="30" height="25" rx="4" fill="#2E7D32"/>
  <rect x="340" y="95" width="12" height="18" rx="2" fill="#1B5E20"/>
  <circle cx="318" cy="115" r="5" fill="#37474F"/>
  <circle cx="332" cy="115" r="5" fill="#37474F"/>
  <!-- Chimney -->
  <rect x="315" y="78" width="8" height="12" rx="2" fill="#1B5E20"/>

  <!-- === CART 1: Cheese === -->
  <rect x="230" y="92" width="40" height="22" rx="3" fill="#8D6E63"/>
  <circle cx="237" cy="116" r="4" fill="#37474F"/>
  <circle cx="263" cy="116" r="4" fill="#37474F"/>
  <!-- Cheese wedge -->
  <path d="M238 92 L250 72 L262 92 Z" fill="#FDD835"/>
  <circle cx="248" cy="84" r="2" fill="#F9A825"/>
  <circle cx="254" cy="88" r="1.5" fill="#F9A825"/>
  <!-- Round cheese -->
  <ellipse cx="252" cy="88" rx="12" ry="6" fill="#FFD54F" opacity="0.6"/>

  <!-- === CART 2: Meat === -->
  <rect x="170" y="92" width="40" height="22" rx="3" fill="#8D6E63"/>
  <circle cx="177" cy="116" r="4" fill="#37474F"/>
  <circle cx="203" cy="116" r="4" fill="#37474F"/>
  <!-- Meat -->
  <ellipse cx="190" cy="84" rx="14" ry="10" fill="#D32F2F"/>
  <path d="M180 82 Q190 76 200 82" stroke="#B71C1C" stroke-width="1.5" fill="none"/>
  <!-- Bone -->
  <circle cx="182" cy="80" r="3" fill="#EFEBE9"/>

  <!-- === CART 3: Vegetables === -->
  <rect x="360" y="92" width="40" height="22" rx="3" fill="#8D6E63"/>
  <circle cx="367" cy="116" r="4" fill="#37474F"/>
  <circle cx="393" cy="116" r="4" fill="#37474F"/>
  <!-- Broccoli -->
  <circle cx="372" cy="82" r="7" fill="#388E3C"/>
  <circle cx="378" cy="79" r="6" fill="#43A047"/>
  <rect x="374" y="85" width="3" height="8" fill="#2E7D32"/>
  <!-- Carrot -->
  <path d="M388 92 L392 74 L396 92 Z" fill="#FF6D00"/>
  <line x1="392" y1="74" x2="390" y2="68" stroke="#388E3C" stroke-width="2"/>
  <line x1="392" y1="74" x2="394" y2="68" stroke="#388E3C" stroke-width="2"/>

  <!-- === BREAD BASKET (extra cart) === -->
  <rect x="110" y="92" width="40" height="22" rx="3" fill="#8D6E63"/>
  <circle cx="117" cy="116" r="4" fill="#37474F"/>
  <circle cx="143" cy="116" r="4" fill="#37474F"/>
  <!-- Bread rolls -->
  <ellipse cx="125" cy="84" rx="10" ry="8" fill="#D4A24E"/>
  <ellipse cx="140" cy="86" rx="8" ry="7" fill="#C08B30"/>
  <path d="M120 82 Q125 78 130 82" stroke="#A67523" stroke-width="1" fill="none"/>

  <!-- === TEXT === -->
  <text x="300" y="410" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#eef6fa" letter-spacing="-1">FoodBridge</text>
  <text x="300" y="445" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" fill="#9db4c0">Piattaforma B2B per la distribuzione alimentare</text>
</svg>
