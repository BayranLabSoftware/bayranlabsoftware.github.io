<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="screen">
      <rect x="40" y="60" width="820" height="460" rx="12"/>
    </clipPath>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.5" fill="#1e293b"/>
    </pattern>
  </defs>

  <!-- Outer frame: laptop/monitor style -->
  <rect width="900" height="540" fill="url(#bg)"/>
  <rect width="900" height="540" fill="url(#dots)" opacity="0.4"/>

  <!-- Monitor frame -->
  <rect x="20" y="20" width="860" height="500" rx="16" fill="#111827" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="20" width="860" height="36" rx="16" fill="#0f172a"/>
  <rect x="20" y="40" width="860" height="16" fill="#0f172a"/>

  <!-- Traffic lights -->
