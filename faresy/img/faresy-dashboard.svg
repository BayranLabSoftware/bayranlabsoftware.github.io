  <circle cx="714" cy="78" r="4" fill="#22c55e"/>
  <text x="743" y="82" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">ONLINE</text>

  <!-- ── Security bar ── -->
  <rect x="40" y="100" width="820" height="28" fill="#0d1526"/>
  <rect x="40" y="128" width="820" height="0.5" fill="#1e293b"/>
  <g font-family="'Segoe UI',sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">
    <rect x="56" y="108" width="58" height="14" rx="7" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="0.6"/>
    <text x="85" y="119" fill="#10b981" text-anchor="middle">🔐 AUTH</text>
    <rect x="122" y="108" width="72" height="14" rx="7" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="0.6"/>
