  <text x="69" y="85" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">FR</text>
  <text x="95" y="82" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f1f5f9" letter-spacing="2">FaReSy</text>
  <text x="147" y="82" font-family="'Segoe UI',sans-serif" font-size="9" fill="#475569">v2.0</text>
