<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1e293b"/>
    </pattern>
  </defs>

  <rect width="900" height="366" fill="url(#bg)"/>
  <rect width="900" height="360" fill="url(#dots)" opacity="0.5"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#blue)" opacity="0.7"/>
  <rect x="0" y="357" width="900" height="3" fill="url(#blue)" opacity="0.4"/>

  <!-- Title -->
  <text x="450" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700"
        fill="#f1f5f9" text-anchor="middle" letter-spacing="3">KEY CAPABILITIES</text>
  <rect x="180" y="50" width="540" height="1.5" rx="1" fill="url(#blue)" opacity="0.5"/>

  <!-- ─── 6 FEATURE CARDS (2 rows × 3) ─── -->

  <!-- Card 1: Multi-Model Ensemble -->
  <g transform="translate(30,70)">
    <rect x="0" y="0" width="250" height="120" rx="12" fill="#0b1120" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="250" height="3" rx="1" fill="url(#blue)" opacity="0.8"/>
    <!-- Icon area -->
    <rect x="16" y="20" width="40" height="40" rx="8" fill="#1e3a8a" fill-opacity="0.6"/>
    <circle cx="30" cy="35" r="7" fill="#3b82f6" opacity="0.7"/>
    <circle cx="42" cy="35" r="7" fill="#818cf8" opacity="0.7"/>
    <text x="36" y="39" font-family="'Segoe UI',sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="800">∩</text>
    <!-- Text -->
    <text x="68" y="34" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Multi-Model</text>
    <text x="68" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#60a5fa">Ensemble</text>
    <text x="16" y="80" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">ArcFace + Facenet512 vote together.</text>
    <text x="16" y="96" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">Unanimous / majority / weighted</text>
    <text x="16" y="112" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">strategies cut false positives 60-70%.</text>
  </g>

  <!-- Card 2: Face Quality Gating -->
  <g transform="translate(325,70)">
    <rect x="0" y="0" width="250" height="120" rx="12" fill="#0b1120" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="250" height="3" rx="1" fill="url(#orange)" opacity="0.8"/>
    <rect x="16" y="20" width="40" height="40" rx="8" fill="#431407" fill-opacity="0.6"/>
    <!-- Gauge -->
    <path d="M26,48 A12,12 0 1,1 46,48" stroke="#fb923c" stroke-width="2" fill="none"/>
    <line x1="36" y1="48" x2="32" y2="36" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="36" cy="48" r="2.5" fill="#fb923c"/>
    <text x="68" y="34" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Image Quality</text>
    <text x="68" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fb923c">Gating</text>
    <text x="16" y="80" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">Sharpness, resolution, brightness,</text>
    <text x="16" y="96" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">pose estimation. Rejects faces</text>
    <text x="16" y="112" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">unfit for reliable recognition.</text>
  </g>

  <!-- Card 3: Anti-Spoofing -->
  <g transform="translate(620,70)">
    <rect x="0" y="0" width="250" height="120" rx="12" fill="#0b1120" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="250" height="3" rx="1" fill="url(#green)" opacity="0.8"/>
    <rect x="16" y="20" width="40" height="40" rx="8" fill="#064e3b" fill-opacity="0.6"/>
    <path d="M36,22 L50,27 L50,38 Q50,46 36,50 Q22,46 22,38 L22,27 Z" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <polyline points="29,36 34,41 44,30" stroke="#34d399" stroke-width="2" fill="none"/>
    <text x="68" y="34" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Liveness &amp;</text>
    <text x="68" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#34d399">Anti-Spoofing</text>
    <text x="16" y="80" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">Detects photos, screens, 3D masks.</text>
    <text x="16" y="96" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">Non-bypassable security gate</text>
    <text x="16" y="112" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">before any recognition attempt.</text>
  </g>

  <!-- Card 4: AES-256 Encryption -->
  <g transform="translate(30,210)">
    <rect x="0" y="0" width="250" height="120" rx="12" fill="#0b1120" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="250" height="3" rx="1" fill="url(#green)" opacity="0.8"/>
    <rect x="16" y="20" width="40" height="40" rx="8" fill="#164e63" fill-opacity="0.6"/>
    <!-- Lock icon -->
    <rect x="26" y="34" width="20" height="16" rx="3" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/>
    <path d="M29,34 L29,28 Q29,22 36,22 Q43,22 43,28 L43,34" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
    <circle cx="36" cy="41" r="2.5" fill="#67e8f9"/>
    <text x="68" y="34" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">AES-256-GCM</text>
    <text x="68" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#22d3ee">Encryption</text>
    <text x="16" y="80" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">Biometric data encrypted at rest.</text>
    <text x="16" y="96" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">Ed25519 digital signatures on every</text>
    <text x="16" y="112" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">audit entry. PBKDF2 key derivation.</text>
  </g>

  <!-- Card 5: RBAC + MFA -->
  <g transform="translate(325,210)">
    <rect x="0" y="0" width="250" height="120" rx="12" fill="#0b1120" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="250" height="3" rx="1" fill="#818cf8" opacity="0.8"/>
    <rect x="16" y="20" width="40" height="40" rx="8" fill="#312e81" fill-opacity="0.6"/>
    <!-- Role layers -->
    <rect x="22" y="24" width="28" height="7" rx="2" fill="#4f46e5" opacity="0.9"/>
    <rect x="22" y="33" width="28" height="7" rx="2" fill="#4338ca" opacity="0.7"/>
    <rect x="22" y="42" width="28" height="7" rx="2" fill="#3730a3" opacity="0.5"/>
    <text x="68" y="34" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">RBAC + TOTP</text>
    <text x="68" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#a78bfa">MFA Auth</text>
    <text x="16" y="80" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">4 roles: operator / investigator /</text>
    <text x="16" y="96" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">supervisor / admin. JWT tokens,</text>
    <text x="16" y="112" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">17 permissions, 5-attempt lockout.</text>
  </g>

  <!-- Card 6: EU AI Act Compliance -->
  <g transform="translate(620,210)">
    <rect x="0" y="0" width="250" height="120" rx="12" fill="#0b1120" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="250" height="3" rx="1" fill="url(#orange)" opacity="0.7"/>
    <rect x="16" y="20" width="40" height="40" rx="8" fill="#451a03" fill-opacity="0.6"/>
    <!-- EU stars -->
    <circle cx="36" cy="40" r="13" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
    <text x="36" y="38" font-family="'Segoe UI',sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">EU</text>
    <text x="36" y="49" font-family="'Segoe UI',sans-serif" font-size="6" fill="#fbbf24" text-anchor="middle">AI ACT</text>
    <text x="68" y="34" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Compliance</text>
    <text x="68" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fbbf24">&amp; Audit Trail</text>
    <text x="16" y="80" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">GDPR Art.17 erasure, LED Art.10,</text>
    <text x="16" y="96" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">CJIS 5.6, demographic bias testing,</text>
    <text x="16" y="112" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">SHA-256 tamper-evident hash chain.</text>
  </g>

  <!-- Bottom stat bar -->
  <rect x="30" y="345" width="840" height="1" fill="#1e293b"/>
  <text x="130" y="358" font-family="'Segoe UI',sans-serif" font-size="10" fill="#475569" text-anchor="middle">226 Tests</text>
  <text x="280" y="358" font-family="'Segoe UI',sans-serif" font-size="10" fill="#475569" text-anchor="middle">15+ REST Endpoints</text>
  <text x="450" y="358" font-family="'Segoe UI',sans-serif" font-size="10" fill="#475569" text-anchor="middle">Multi-Camera RTSP/ONVIF</text>
  <text x="620" y="358" font-family="'Segoe UI',sans-serif" font-size="10" fill="#475569" text-anchor="middle">FAISS Vector Search</text>
  <text x="790" y="358" font-family="'Segoe UI',sans-serif" font-size="10" fill="#475569" text-anchor="middle">Docker Ready</text>
</svg>
